<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Configurar tasa de interés</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .contenedor {
            max-width: 900px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .titulo {
            margin-bottom: 20px;
            font-size: 26px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo input {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        .acciones {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            color: white;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.25);
        }

        .btn-azul {
            background: linear-gradient(135deg, #3b82f6, #1e3a8a);
        }

        .btn-gris {
            background: linear-gradient(135deg, #6b7280, #374151);
        }

        .lista-tasas {
            margin-top: 30px;
        }

        .card-tasa {
            display: flex;
            justify-content: space-between;
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.05);
        }

    </style>
</head>

<body>

<div class="contenedor">

    <h2 class="titulo">Configuración tasa de interés variable</h2>

    <form method="POST">

        <div class="form-grid">

            <div class="campo">
                <label>Año</label>
                <input type="number" name="anio" required placeholder="Ej: 2026">
            </div>

            <div class="campo">
                <label>Tasa mensual (%)</label>
                <input type="number" step="0.01" name="tasa" required placeholder="Ej: 1.5">
            </div>

        </div>

        <div class="acciones">
            <button type="submit" class="btn btn-azul">Guardar</button>
            <a href="/dashboard" class="btn btn-gris">Volver</a>
        </div>

    </form>

    <div class="lista-tasas">

        {% for t in tasas %}
        <div class="card-tasa">
            <strong>Año {{ t.anio }}</strong>
            <span>{{ t.tasa_mensual }} % mensual</span>
        </div>
        {% else %}
        <p style="margin-top:20px;">No hay tasas registradas</p>
        {% endfor %}

    </div>

</div>

</body>
</html>
