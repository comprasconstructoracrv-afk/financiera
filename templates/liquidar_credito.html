<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Liquidar crédito</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }
        .contenedor {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.08);
        }
        h1 {
            margin-bottom: 25px;
        }
        .dato {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .total {
            background: #fff3cd;
            border: 1px solid #ffe69c;
            font-weight: bold;
        }
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button, a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }
        button {
            background: #dc3545;
            color: white;
        }
        a {
            background: #6c757d;
            color: white;
            margin-left: 10px;
        }
    </style>
    <script>
        function mostrarOtroMedio() {
            const medio = document.getElementById("medio_pago").value;
            const otro = document.getElementById("otro_medio_box");
            otro.style.display = medio === "OTRO" ? "block" : "none";
        }

        function ponerValorExacto() {
            const total = "{{ total_liquidacion }}";
            document.getElementById("valor").value = total;
        }

        window.onload = function() {
            ponerValorExacto();
        };
    </script>
</head>
<body>
    <div class="contenedor">
        <h1>Liquidar crédito</h1>

        <div class="dato"><strong>Cliente:</strong> {{ credito.cliente }}</div>
        <div class="dato"><strong>Cuota activa de referencia:</strong> {{ cuota_actual.numero }}</div>
        <div class="dato"><strong>Capital insoluto:</strong> {{ capital_insoluto | cop }}</div>
        <div class="dato"><strong>Interés corriente:</strong> {{ interes_corriente | cop }}</div>
        <div class="dato"><strong>Mora acumulada:</strong> {{ total_mora | cop }}</div>
        <div class="dato total"><strong>Total liquidación:</strong> {{ total_liquidacion | cop }}</div>

        <form method="POST">
            <label>Fecha de pago:</label>
            <input type="date" name="fecha_pago" required>

            <label>Valor a pagar:</label>
            <input type="number" id="valor" name="valor" step="0.01" required>

            <label>Medio de pago:</label>
            <select name="medio_pago" id="medio_pago" onchange="mostrarOtroMedio()" required>
                <option value="">Seleccione</option>
                <option value="Bancolombia">Bancolombia</option>
                <option value="Efectivo">Efectivo</option>
                <option value="OTRO">Otro</option>
            </select>

            <div id="otro_medio_box" style="display:none;">
                <label>Escriba el otro medio de pago:</label>
                <input type="text" name="medio_pago_otro">
            </div>

            <button type="submit">Liquidar crédito</button>
            <a href="/ver_cuotas/{{ credito.id }}">Volver</a>
        </form>
    </div>
</body>
</html>
