<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ingreso al sistema</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.96);
            padding: 45px 40px;
            border-radius: 20px;
            width: 420px;
            text-align: center;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(6px);
        }

        .logo {
            width: 200px;
            max-width: 100%;
            margin-bottom: 18px;
        }

        h2 {
            margin: 10px 0 28px 0;
            font-size: 34px;
            color: #1f2937;
        }

        label {
            display: block;
            text-align: left;
            font-size: 14px;
            margin-bottom: 7px;
            margin-top: 16px;
            color: #374151;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px 12px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            font-size: 15px;
            background: #f8fafc;
        }

        input:focus {
            outline: none;
            border-color: #0d6efd;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.15);
            background: white;
        }

        button {
            margin-top: 24px;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #0d6efd, #0b5ed7);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(13, 110, 253, 0.25);
        }

        .footer {
            margin-top: 18px;
            font-size: 13px;
            color: #6b7280;
        }

        .overlay-alerta {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(3px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .overlay-alerta.activo {
            display: flex;
        } 

        .alerta-box {
            background: white;
            width: 90%;
            max-width: 420px;
            border-radius: 18px;
            padding: 28px;
            text-align: center;
            box-shadow: 0 20px 45px rgba(0,0,0,0.18);
            animation: aparecerAlerta 0.2s ease;
        }

       .alerta-icono {
            width: 64px;
            height: 64px;
            margin: 0 auto 14px auto;
            border-radius: 50%;
            background: #fff3cd;
            color: #b45309;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: bold;
        }

        .alerta-box h3 {
            margin: 0 0 10px 0;
            font-size: 24px;
            color: #102a43;
        }

        .alerta-box p {
            margin: 0 0 18px 0;
            font-size: 16px;
            color: #52606d;
            line-height: 1.5;
        }

        .btn-alerta {
            border: none;
            background: linear-gradient(135deg, #dc3545, #b02a37);
            color: white;
            padding: 11px 18px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .btn-alerta:hover {
            transform: translateY(-1px);
            opacity: 0.95;
        }

        @keyframes aparecerAlerta {
            from {
                  opacity: 0;
                  transform: scale(0.96);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div id="overlay-alerta" class="overlay-alerta activo">
      <div class="alerta-box">
        <div class="alerta-icono">⚠</div>
        <h3>Error de acceso</h3>
        {% for category, message in messages %}
          <p>{{ message }}</p>
        {% endfor %}
        <button type="button" class="btn-alerta" onclick="cerrarAlerta()">Entendido</button>
      </div>
    </div>
  {% endif %}
{% endwith %}

<div class="login-container">
    <img src="{{ url_for('static', filename='logo.png') }}" class="logo" alt="Logo CRV">

    <h2>Ingreso al sistema</h2>

    <form method="POST">
        <label>Usuario</label>
        <input type="text" name="username" required>

        <label>Contraseña</label>
        <input type="password" name="password" required>

        <button type="submit">Ingresar</button>
    </form>

    <div class="footer">
        Sistema financiero
    </div>
</div>

<script>
function cerrarAlerta() {
    const overlay = document.getElementById('overlay-alerta');
    if (overlay) {
        overlay.classList.remove('activo');
    }
}
</script>

</body>
</html>
