<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ingreso al sistema</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.96);
            padding: 45px 40px;
            border-radius: 20px;
            width: 420px;
            text-align: center;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(6px);
        }

        .logo {
            width: 200px;
            max-width: 100%;
            margin-bottom: 18px;
        }

        h2 {
            margin: 10px 0 28px 0;
            font-size: 34px;
            color: #1f2937;
        }

        label {
            display: block;
            text-align: left;
            font-size: 14px;
            margin-bottom: 7px;
            margin-top: 16px;
            color: #374151;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px 12px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            font-size: 15px;
            background: #f8fafc;
        }

        input:focus {
            outline: none;
            border-color: #0d6efd;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.15);
            background: white;
        }

        button {
            margin-top: 24px;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #0d6efd, #0b5ed7);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(13, 110, 253, 0.25);
        }

        .footer {
            margin-top: 18px;
            font-size: 13px;
            color: #6b7280;
        }
    </style>
</head>
<body>

<div class="login-container">
    <img src="{{ url_for('static', filename='logo.png') }}" class="logo" alt="Logo CRV">

    <h2>Ingreso al sistema</h2>

    <form method="POST">
        <label>Usuario</label>
        <input type="text" name="username" required>

        <label>Contraseña</label>
        <input type="password" name="password" required>

        <button type="submit">Ingresar</button>
    </form>

    <div class="footer">
        Sistema financiero
    </div>
</div>

</body>
</html>
