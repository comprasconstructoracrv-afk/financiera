<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar datos del cliente</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            background:#eef3f8;
            padding:40px;
        }

        .contenedor{
            max-width:900px;
            margin:auto;
            background:white;
            border-radius:24px;
            padding:40px;
            box-shadow:0 10px 30px rgba(0,0,0,0.08);
        }

        .header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:35px;
            border-bottom:1px solid #e5e7eb;
            padding-bottom:25px;
        }

        .titulo{
            font-size:38px;
            font-weight:800;
            color:#0f172a;
        }

        .subtitulo{
            color:#64748b;
            margin-top:8px;
            font-size:16px;
        }

        .logo{
            width:120px;
        }

        .info-pagare{
            background:#f8fafc;
            border:1px solid #dbe4ee;
            border-radius:18px;
            padding:20px;
            margin-bottom:30px;
        }

        .info-pagare h3{
            color:#1e293b;
            margin-bottom:10px;
            font-size:20px;
        }

        .grid-form{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:25px;
        }

        .grupo{
            display:flex;
            flex-direction:column;
        }

        .grupo.full{
            grid-column:1 / 3;
        }

        label{
            margin-bottom:8px;
            font-weight:700;
            color:#334155;
        }

        input{
            height:52px;
            border:1px solid #cbd5e1;
            border-radius:14px;
            padding:0 16px;
            font-size:15px;
            transition:0.2s;
            background:white;
        }

        input:focus{
            outline:none;
            border-color:#2563eb;
            box-shadow:0 0 0 4px rgba(37,99,235,0.12);
        }

        .botones{
            display:flex;
            justify-content:flex-end;
            gap:14px;
            margin-top:40px;
        }

        .btn{
            padding:14px 24px;
            border:none;
            border-radius:14px;
            font-size:15px;
            font-weight:700;
            cursor:pointer;
            text-decoration:none;
            transition:0.2s;
        }

        .btn-guardar{
            background:#2563eb;
            color:white;
        }

        .btn-guardar:hover{
            background:#1d4ed8;
        }

        .btn-volver{
            background:#475569;
            color:white;
        }

        .btn-volver:hover{
            background:#334155;
        }

        @media(max-width:768px){

            .grid-form{
                grid-template-columns:1fr;
            }

            .grupo.full{
                grid-column:auto;
            }

            .header{
                flex-direction:column;
                gap:20px;
                text-align:center;
            }

            .botones{
                flex-direction:column;
            }

            .btn{
                width:100%;
            }
        }

    </style>

</head>
<body>

    <div class="contenedor">

        <div class="header">

            <div>
                <div class="titulo">
                    Actualizar datos del cliente
                </div>

                <div class="subtitulo">
                    Modifica la información personal asociada al crédito.
                </div>
            </div>

            <img src="{{ url_for('static', filename='logo.png') }}" class="logo">

        </div>

        <div class="info-pagare">
            <h3>Pagaré Nº {{ credito.numero_pagare }}</h3>

            <p>
                <strong>Cliente:</strong>
                {{ credito.cliente }}
            </p>
        </div>

        <form method="POST">

            <div class="grid-form">

                <div class="grupo">
                    <label>Nombre del cliente</label>

                    <input
                        type="text"
                        name="cliente"
                        value="{{ credito.cliente or '' }}"
                        required
                    >
                </div>

                <div class="grupo">
                    <label>Cédula</label>

                    <input
                        type="text"
                        value="{{ credito.cedula_cliente or '' }}"
                        disabled
                    >
                </div>

                <div class="grupo">
                    <label>Teléfono 1</label>

                    <input
                        type="text"
                        name="telefono_1"
                        value="{{ credito.telefono_1 or '' }}"
                    >
                </div>

                <div class="grupo">
                    <label>Teléfono 2</label>

                    <input
                        type="text"
                        name="telefono_2"
                        value="{{ credito.telefono_2 or '' }}"
                    >
                </div>

                <div class="grupo full">
                    <label>Dirección</label>

                    <input
                        type="text"
                        name="direccion_cliente"
                        value="{{ credito.direccion_cliente or '' }}"
                    >
                </div>

                <div class="grupo full">
                    <label>Correo electrónico</label>

                    <input
                        type="email"
                        name="correo_cliente"
                        value="{{ credito.correo_cliente or '' }}"
                    >
                </div>

            </div>

            <div class="botones">

                <a
                    href="{{ url_for('ver_cuotas', credito_id=credito.id) }}"
                    class="btn btn-volver"
                >
                    Volver
                </a>

                <button
                    type="submit"
                    class="btn btn-guardar"
                >
                    Guardar cambios
                </button>

            </div>

        </form>

    </div>

</body>
</html>
