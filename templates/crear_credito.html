<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Crédito</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }

        .contenedor {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 25px;
        }

        h2 {
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 20px;
            color: #0d6efd;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 8px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .botones {
            margin-top: 25px;
        }

        button, a {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        button {
            background: #007bff;
            color: white;
        }

        a {
            background: #6c757d;
            color: white;
            margin-left: 10px;
        }

        #bloque_codeudor {
            display: none;
            margin-top: 10px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 1px solid #dee2e6;
        }
    </style>

    <script>
        function soloDigitos(valor) {
            return valor.replace(/\D/g, '');
        }

        function formatearCOP(valor) {
            if (!valor) return '';
            return '$ ' + Number(valor).toLocaleString('es-CO');
        }

        function alEscribirMoneda(input) {
            const digitos = soloDigitos(input.value);

            if (digitos === '') {
                input.value = '';
                return;
            }

            input.value = formatearCOP(digitos);
        }

        function limpiarMonedaAntesDeEnviar(form) {
            const camposMoneda = form.querySelectorAll('.input-moneda');

            camposMoneda.forEach(input => {
                input.value = soloDigitos(input.value);
            });
        }

        function toggleCodeudor() {
            const selector = document.getElementById('tiene_codeudor');
            const bloque = document.getElementById('bloque_codeudor');

            if (selector.value === 'SI') {
                bloque.style.display = 'block';
            } else {
                bloque.style.display = 'none';
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            const camposMoneda = document.querySelectorAll('.input-moneda');

            camposMoneda.forEach(input => {
                if (input.value && input.value.trim() !== '') {
                    const limpio = soloDigitos(input.value);
                    if (limpio !== '') {
                        input.value = formatearCOP(limpio);
                    }
                }

                input.addEventListener('input', function () {
                    alEscribirMoneda(this);
                });

                input.addEventListener('blur', function () {
                    const limpio = soloDigitos(this.value);
                    this.value = limpio ? formatearCOP(limpio) : '';
                });

                input.addEventListener('focus', function () {
                    const limpio = soloDigitos(this.value);
                    this.value = limpio;
                });
            });

            document.querySelectorAll('form').forEach(form => {
                form.addEventListener('submit', function () {
                    limpiarMonedaAntesDeEnviar(this);
                });
            });

            toggleCodeudor();
        });
    </script>
</head>
<body>
    <div class="contenedor">
        <h1>Crear Crédito</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div style="margin-bottom: 20px;">
              {% for category, message in messages %}
                <div style="
                    padding: 12px 14px;
                    border-radius: 8px;
                    margin-bottom: 10px;
                    color: white;
                    font-weight: bold;
                    background-color: {% if category == 'success' %}#198754{% else %}#dc3545{% endif %};
                ">
                  {{ message }}
                </div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <h2>Datos del cliente</h2>

            <label>Nombre completo:</label>
            <input type="text" name="cliente" required>

            <label>Cédula:</label>
            <input type="text" name="cedula_cliente">

            <label>Teléfono 1:</label>
            <input type="text" name="telefono_1">

            <label>Teléfono 2:</label>
            <input type="text" name="telefono_2">

            <label>Dirección:</label>
            <input type="text" name="direccion_cliente">

            <label>Correo electrónico:</label>
            <input type="email" name="correo_cliente">

            <h2>Datos del crédito</h2>

            <label>Número de pagaré:</label>
            <input type="text" name="numero_pagare" required>

            <label>Fecha del crédito:</label>
            <input type="date" name="fecha_credito" required>

            <label>Monto solicitado:</label>
            <input type="text" name="monto" class="input-moneda" inputmode="numeric" required>

            <label>Abono inicial:</label>
            <input type="text" name="abono_inicial" class="input-moneda" inputmode="numeric" placeholder="0">

            <label>Interés mensual (%):</label>
            <input type="number" name="interes" step="0.01" required>

            <label>Cuotas:</label>
            <input type="number" name="cuotas" required>

            <label>Sede:</label>
            <select name="sede" required>
                <option value="">Seleccione una sede</option>
                <option value="IBAGUE">Ibagué</option>
                <option value="ESPINAL">Espinal</option>
                <option value="GIRARDOT">Girardot</option>
                <option value="CRV">CRV</option>
            </select>
            
            <h2>Codeudor</h2>

            <label>¿Tiene codeudor?</label>
            <select name="tiene_codeudor" id="tiene_codeudor" onchange="toggleCodeudor()">
                <option value="NO" selected>No</option>
                <option value="SI">Sí</option>
            </select>

            <div id="bloque_codeudor">
                <label>Nombre del codeudor:</label>
                <input type="text" name="codeudor_nombre">

                <label>Identificación del codeudor:</label>
                <input type="text" name="codeudor_identificacion">

                <label>Dirección del codeudor:</label>
                <input type="text" name="codeudor_direccion">

                <label>Teléfono del codeudor:</label>
                <input type="text" name="codeudor_telefono">

                <label>Correo del codeudor:</label>
                <input type="email" name="codeudor_correo">
            </div>

            <div class="botones">
                <button type="submit">Crear</button>
                <a href="/dashboard">Volver</a>
            </div>
        </form>
    </div>
</body>
</html>
